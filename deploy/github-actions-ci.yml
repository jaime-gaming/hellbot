name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile check
        run: python -m compileall -q hell launcher tests tools bot.py Announcements.py

      - name: Lint (pyflakes)
        run: python -m pyflakes hell launcher tests tools bot.py Announcements.py

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy

      - name: Run test suite
        run: python -m pytest

      - name: Run offline event simulations
        run: |
          python tools/simulate.py --step 900 > /dev/null
          python tools/simulate.py --fail-at 40 --step 900 > /dev/null
