name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes hell launcher tests tools bot.py Announcements.py
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest
      - name: Offline event simulation (success + failure paths)
        run: |
          python tools/simulate.py --step 900 > /dev/null
          python tools/simulate.py --fail-at 40 --step 900 > /dev/null
