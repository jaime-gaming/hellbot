services:
  hellbot:
    build: .
    container_name: welcome-to-hell
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/hell.sqlite3
    ports:
      # Host port:container port — both follow WEB_PORT (same .env the bot
      # reads), so changing WEB_PORT keeps the dashboard reachable.
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - hell-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  hell-data:
